name: Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore validation result cache
        uses: actions/cache@v6
        with:
          path: output/tooling/checks
          key: validation-${{ runner.os }}-node24-shard${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig.json', 'src/**/*.ts') }}
          restore-keys: |
            validation-${{ runner.os }}-node24-shard${{ matrix.shard }}-

      - name: Run compact validation
        run: npm run check:compact -- --shard ${{ matrix.shard }}/4

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-logs-shard-${{ matrix.shard }}
          path: output/tooling/checks
          if-no-files-found: ignore
          retention-days: 7
